name: Build Windows

# 推送 v* 标签 → 构建并发布 Release；手动触发 → 仅构建并上传 Artifact
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # 打 tag 时创建 Release 需要

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Build frontend (panel static export)
        working-directory: panel
        run: |
          npm install
          npm run build

      - name: Read version
        id: ver
        run: |
          $v = (Select-String -Path app/__version__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version=$v"

      - name: Build single-file exe
        run: |
          uv sync --frozen --group build
          uv run pyinstaller recorder.spec --noconfirm

      - name: Rename artifact with version
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Move-Item "dist/StreamGetRecorder.exe" "dist/StreamGetRecorder-v$v.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: StreamGetRecorder-v${{ steps.ver.outputs.version }}
          path: dist/StreamGetRecorder-v*.exe
          if-no-files-found: error

      - name: Create release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: StreamGetRecorder v${{ steps.ver.outputs.version }}
          files: dist/StreamGetRecorder-v*.exe
